<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Girlfriend Chat</title>
    <script src="chat.js" defer></script>
    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #chat-box {
            width: 100%;
            height: 400px;
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        #input-box {
            width: 80%;
            padding: 10px;
        }
        #send-btn {
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <h2>AI Girlfriend 💙</h2>

    <div id="chat-box"></div>

    <input id="input-box" type="text" placeholder="Type your message...">
    <button id="send-btn">Send</button>

</body>
</html>
